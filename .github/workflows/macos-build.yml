name: macOS build

# 只为出 macOS 安装包：不跑仓库原有 CI，手动触发或推到 macos-build 分支时运行。
# 放在 fork 的 .github/workflows/macos-build.yml。
on:
  workflow_dispatch:
  push:
    branches: [macos-build]
    paths:
      - '.github/workflows/macos-build.yml'
      - 'macos/**'
      # Dart 代码与资源也要重新打包，否则改了 lib/ 不会触发构建。
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'

permissions:
  contents: write

jobs:
  macos:
    # 关键：macos-15 / macos-latest 是 Apple Silicon（arm64），编出来的 .app 在 Intel Mac 上跑不了。
    # Intel 机器用 macos-15-intel（macOS 15.7 + 默认 Xcode 16.4）或 macos-26-intel（macOS 26 + Xcode 26.x）。
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'   # 与仓库 CI 固定的一致（.github/actions/setup-flutter/action.yml:28）
          cache: true

      # 默认 Xcode 16.4 的 SDK 里没有 video_player_avfoundation 2.12.3 需要的
      # AVAsset.load(_:isolation:) 新 API，必须切到镜像里预装的 Xcode 26.x。
      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          XC="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          echo "using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Show toolchain
        run: |
          flutter --version
          xcodebuild -version
          pod --version
          df -h /

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS release
        run: |
          set -o pipefail
          flutter build macos --release 2>&1 | tee /tmp/build.log

      - name: Verify renderer settings
        run: |
          set -euo pipefail
          APP="build/macos/Build/Products/Release/Jotsy.app"
          test -d "$APP"
          echo "Impeller: $(/usr/libexec/PlistBuddy -c 'Print :FLTEnableImpeller' "$APP/Contents/Info.plist")"
          echo "MinOS:    $(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP/Contents/Info.plist")"
          # 只出 x86_64：ARCHS 在 macos/Runner.xcodeproj 里写死，防止 runner 默认
          # 编成 universal 把包体翻倍。
          ARCHS="$(lipo -archs "$APP/Contents/MacOS/Jotsy")"
          echo "Archs:    $ARCHS"
          test "$ARCHS" = "x86_64"

      - name: Diagnose failure
        if: failure()
        run: |
          {
            echo '### Build log tail'
            echo '```'
            tail -n 250 /tmp/build.log 2>/dev/null || echo '(no build log captured)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish build log
        if: failure()
        run: |
          mkdir -p ci-logs
          tail -n 400 /tmp/build.log > ci-logs/build.txt 2>/dev/null || echo '(no build log captured)' > ci-logs/build.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f ci-logs/build.txt
          if git diff --cached --quiet; then echo 'nothing to publish'; exit 0; fi
          git commit -m 'ci: capture macOS build log'
          git push origin HEAD:macos-build

      - name: Package dmg and zip
        run: |
          set -euo pipefail
          APP="build/macos/Build/Products/Release/Jotsy.app"
          test -d "$APP"
          # 工程里已是 ad-hoc 签名（project.pbxproj:450 CODE_SIGN_IDENTITY = "-"），
          # 但那条签名带的是 Release.entitlements（含 app-sandbox），重新签一次换成
          # AdHoc.entitlements：不开沙盒（数据仍留在 ~/Library/Application Support），
          # 但要带上 file_picker 另存为要求的 User Selected Files 读写权限。
          codesign --force --deep --sign - \
            --entitlements macos/Runner/AdHoc.entitlements "$APP"
          codesign --verify --deep --strict "$APP"
          ENTITLEMENTS="$(codesign -d --entitlements :- "$APP" 2>/dev/null || true)"
          echo "$ENTITLEMENTS"
          if ! grep -q 'files.user-selected.read-write' <<<"$ENTITLEMENTS"; then
            echo '签名缺少 com.apple.security.files.user-selected.read-write，导出/另存为会报 ENTITLEMENT_REQUIRED_WRITE' >&2
            exit 1
          fi
          VERSION="$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          hdiutil create -volname "Jotsy" -srcfolder "$APP" -ov -format UDZO \
            "Jotsy-${VERSION}-macos-x64.dmg"
          # .app 必须用 ditto 打包，普通 zip 会丢符号链接和可执行位。
          ditto -c -k --sequesterRsrc --keepParent "$APP" "Jotsy-${VERSION}-macos-x64.zip"
          ls -lh *.dmg *.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jotsy-macos-x64
          path: |
            *.dmg
            *.zip
          if-no-files-found: error
          retention-days: 14
